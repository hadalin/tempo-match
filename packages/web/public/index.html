<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tempo Match: find a Spotify song at any BPM</title>
  <meta name="description" content="Pick a tempo and get a song that matches it, ready to play on Spotify.">
  <link rel="canonical" href="https://tempo-match.hadalin.me/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tempo Match">
  <meta property="og:title" content="Tempo Match: find a Spotify song at any BPM">
  <meta property="og:description" content="Pick a tempo and get a song that matches it, ready to play on Spotify.">
  <meta property="og:url" content="https://tempo-match.hadalin.me/">
  <meta property="og:image" content="https://tempo-match.hadalin.me/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tempo Match: a green metronome next to the app name">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tempo Match: find a Spotify song at any BPM">
  <meta name="twitter:description" content="Pick a tempo and get a song that matches it, ready to play on Spotify.">
  <meta name="twitter:image" content="https://tempo-match.hadalin.me/og-image.png">
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { width: 100%; max-width: 420px; }
    h1 { margin: 0 0 24px; font-size: 1.75rem; }
    form { display: grid; gap: 16px; }
    .bpm { display: flex; align-items: center; gap: 8px; }
    .bpm input {
      width: 4ch;
      min-height: 64px;
      padding: 0;
      border: 0;
      border-bottom: 2px dashed var(--muted);
      background: none;
      color: inherit;
      font: 700 3rem/1 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      text-align: center;
      -moz-appearance: textfield;
    }
    .bpm input::-webkit-inner-spin-button,
    .bpm input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .bpm input:focus { outline: none; border-bottom-color: var(--accent); }
    .bpm span { flex: 1; color: var(--muted); }
    .step {
      flex: none;
      width: 56px;
      height: 56px;
      padding: 0;
      background: var(--card);
      color: var(--fg);
      font-size: 1.75rem;
      line-height: 1;
    }
    .step svg { display: block; width: 28px; height: 28px; margin: auto; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .actions #submit { flex: 1; }
    input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); }
    button {
      min-height: 48px;
      padding: 12px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: var(--disabled-bg); color: var(--disabled-fg); cursor: default; }
    #result { margin-top: 24px; min-height: 96px; }
    .card { padding: 16px; border-radius: 12px; background: var(--card); }
    .card h2 { margin: 0; font-size: 1.25rem; }
    .card p { margin: 4px 0 12px; color: var(--muted); }
    .card iframe { display: block; width: 100%; height: 152px; margin-bottom: 12px; border: 0; border-radius: 12px; }
    .card .hint { margin: -4px 0 12px; font-size: .85rem; }
    .play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      border: 2px solid var(--outline);
      border-radius: 999px;
      background: var(--card);
      color: var(--fg);
      font-weight: 600;
      text-decoration: none;
    }
    .play svg { width: 24px; height: 24px; flex: none; }
    .play:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
    .web {
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 44px;
      margin-inline: auto;
      color: var(--muted);
      font-size: .9rem;
    }
    #autoplay { display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--muted); }
    #autoplay svg { width: 26px; height: 26px; margin: 0; }
    #autoplay .dice { width: 14px; height: 14px; }
    #autoplay:not([data-mode=off]) { color: var(--outline); }
    .tip-anchor { position: relative; flex: none; }
    .tooltip {
      position: absolute;
      right: 0;
      bottom: calc(100% + 10px);
      z-index: 1;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--fg);
      color: var(--bg);
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s, visibility .15s;
    }
    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 22px;
      border: 6px solid transparent;
      border-top-color: var(--fg);
    }
    #autoplay:focus-visible + .tooltip, .tooltip.shown { opacity: 1; visibility: visible; }
    @media (hover: hover) {
      #autoplay:hover + .tooltip { opacity: 1; visibility: visible; }
    }
    .card .autoplay-note { margin: 4px 0 0; font-size: .85rem; text-align: center; }
    .error { color: var(--error); }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .loading .bpm input, .loading #bpm { visibility: hidden; }
    footer { margin-top: 32px; font-size: .85rem; color: var(--faint); }
    footer a { color: inherit; }
    footer nav a { display: inline-block; padding: 12px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Tempo Match</h1>
    <form id="form" class="loading">
      <label for="value">Pick a tempo</label>
      <div class="bpm">
        <input id="value" type="number" inputmode="numeric" min="40" max="220" value="120">
        <span>BPM</span>
        <button id="down" class="step" type="button" aria-label="Decrease tempo">−</button>
        <button id="up" class="step" type="button" aria-label="Increase tempo">+</button>
      </div>
      <input id="bpm" name="bpm" type="range" min="40" max="220" value="120" aria-label="Tempo slider">
      <div class="actions">
        <button id="submit" type="submit">Find a song</button>
        <span class="tip-anchor">
          <button id="autoplay" class="step" type="button"></button>
          <span id="autoplay-tip" class="tooltip" aria-hidden="true"></span>
        </span>
      </div>
    </form>
    <section id="result" aria-live="polite"></section>
    <footer>
      <nav aria-label="Site"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="https://github.com/hadalin/tempo-match">Source (MIT)</a></nav>
    </footer>
  </main>
  <script src="/spotify-embed.js"></script>
  <script src="/app.js"></script>
</body>
</html>
