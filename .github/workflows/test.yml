name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: docker compose config -q
        env:
          GETSONGBPM_API_KEY: ci
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
